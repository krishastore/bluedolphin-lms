# =====================================================
# KrishaWeb — WordPress SonarQube Configuration
# =====================================================
sonar.projectName=skilltriks

# Source paths (custom plugin code only — not vendor/build output).
# This repo IS the plugin, so we list our own code explicitly rather than
# scanning "." which would drag in vendor/, node_modules/ and tests/.
sonar.sources=\
    src,\
    templates,\
    assets,\
    skilltriks.php,\
    uninstall.php

# Language config omitted to allow multi-language scanning (PHP, JS, CSS, SCSS)
# Exclusions
sonar.exclusions=\
    **/vendor/**,\
    **/node_modules/**,\
    **/*.min.js,\
    **/*.min.css,\
    **/assets/js/build/**,\
    **/assets/font/**,\
    **/assets/images/**,\
    **/assets/csv/**,\
    **/index.php

# CPD (duplication) exclusions
sonar.cpd.exclusions=\
    src/Collections/taxonomies,\
    src/Notification,\

sonar.test.exclusions=**/vendor/**,**/node_modules/**

# Encoding
sonar.sourceEncoding=UTF-8

# PHP file suffixes
sonar.php.file.suffixes=.php,.inc

# ── PHPCS Report Import (via Generic Issue Import) ───
sonar.externalIssuesReportPaths=reports/phpcs-sonar.json
